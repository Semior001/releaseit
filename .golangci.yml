version: "2"
run:
  tests: false

linters:
  default: none
  enable:
    - dupl
    - gocyclo
    - gosec
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  exclusions:
    generated: lax
    rules:
      - { linters: [ staticcheck ], text: 'SA5008: duplicate struct tag' }
      - { linters: [ staticcheck ], text: 'QF1008: could remove embedded field' }
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
